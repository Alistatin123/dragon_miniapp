<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Mining</title>

<style>
body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding-bottom:80px;
}

.header{
padding:20px;
}

.logo{
font-size:60px;
}

.balance,.card{
background:#1e293b;
margin:15px;
padding:20px;
border-radius:20px;
}

.dragon{
font-size:50px;
}

button{
background:#2563eb;
color:white;
border:0;
padding:12px 25px;
border-radius:15px;
font-size:16px;
}

.menu{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#020617;
display:flex;
justify-content:space-around;
padding:12px 0;
}

.menu div{
font-size:13px;
}
</style>

</head>

<body>

<div class="header">
<div class="logo">🐉</div>
<h1>Dragon Mining</h1>
<p>Mine • Invite • Earn</p>
</div>

<div class="balance">
💎 Balance<br>
0 DRAGON
</div>

<div class="card">
<div class="dragon">🟢🐉</div>
<h2>Green Dragon</h2>
<p>Deposit: 2 TON</p>
<p>Reward: 0.2 TON / Day</p>
<button>Start Mining</button>
</div>

<div class="card">
<div class="dragon">🔴🐉</div>
<h2>Red Dragon</h2>
<p>Deposit: 5 TON</p>
<p>Reward: 0.5 TON / Day</p>
<button>Start Mining</button>
</div>

<div class="card">
<div class="dragon">⚪🐉</div>
<h2>White Dragon</h2>
<p>Deposit: 10 TON</p>
<p>Reward: 1 TON / Day</p>
<button>Start Mining</button>
</div>

<div class="menu">
<div>⛏️<br>Mine</div>
<div>👥<br>Friends</div>
<div>📋<br>Tasks</div>
<div>💰<br>Wallet</div>
</div>

</body>
</html>
