<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dragon Mining</title>

<style>

body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding-bottom:80px;
}

.header{
padding:20px;
}

.logo{
font-size:60px;
}

.balance,.card{
background:#1e293b;
margin:15px;
padding:20px;
border-radius:20px;
}

.dragon{
font-size:50px;
}

button{
background:#2563eb;
color:white;
border:0;
padding:12px 25px;
border-radius:15px;
font-size:16px;
}

.menu{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#020617;
display:flex;
justify-content:space-around;
padding:12px 0;
}

.menu div{
font-size:13px;
cursor:pointer;
}

</style>

</head>


<body>


<div class="header">

<div class="logo">🐉</div>

<h1>Dragon Mining</h1>

<p>Mine • Invite • Earn</p>

</div>



<div class="balance" id="balance">

💎 Balance<br>

0 DRAGON

</div>




<div class="card">

<div class="dragon">🟢🐉</div>

<h2>Green Dragon</h2>

<p>Deposit: 2 TON</p>

<p>Reward: 0.2 TON / Day</p>

<button onclick="startMining()">
Start Mining
</button>

</div>




<div class="card">

<div class="dragon">🔴🐉</div>

<h2>Red Dragon</h2>

<p>Deposit: 5 TON</p>

<p>Reward: 0.5 TON / Day</p>

<button onclick="startMining()">
Start Mining
</button>

</div>




<div class="card">

<div class="dragon">⚪🐉</div>

<h2>White Dragon</h2>

<p>Deposit: 10 TON</p>

<p>Reward: 1 TON / Day</p>

<button onclick="startMining()">
Start Mining
</button>

</div>




<div class="menu">

<div onclick="startMining()">
⛏️<br>
Mine
</div>


<div onclick="showFriends()">
👥<br>
Friends
</div>


<div>
📋<br>
Tasks
</div>


<div>
💰<br>
Wallet
</div>


</div>




<script>


let balance =
parseFloat(localStorage.getItem("dragon_balance")) || 0;



function updateBalance(){

document.getElementById("balance").innerHTML =
"💎 Balance<br>" +
balance.toFixed(2) +
" DRAGON";

}


updateBalance();




function startMining(){

alert("⛏️ Mining Started!");

setInterval(function(){

balance += 0.01;

localStorage.setItem(
"dragon_balance",
balance
);

updateBalance();

},10000);

}





function showFriends(){


let referralCode =
localStorage.getItem("ref_code");


if(!referralCode){

referralCode =
"DRAGON" +
Math.floor(1000 + Math.random()*9000);


localStorage.setItem(
"ref_code",
referralCode
);

}



let referralLink =
"https://t.me/AlistatinBot?start=" +
referralCode;



alert(

"👥 Friends & Referral\n\n"+

"Invite friends and earn rewards!\n\n"+

"🎁 Referral Bonus:\n"+
"Get 5% bonus from every deposit made by your invited friends.\n\n"+

"Your Referral Code:\n"+
referralCode+
"\n\n"+

"Your Referral Link:\n"+
referralLink

);


}



</script>


</body>

</html>
